<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Window Chrome Header -->
  <rect width="900" height="42" rx="16" fill="#1e293b" />
  <rect y="30" width="900" height="12" fill="#1e293b" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />

  <!-- URL Bar -->
  <rect x="180" y="10" width="540" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="450" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">https://alssport.store/home</text>

  <!-- Top Nav in App -->
  <rect y="42" width="900" height="48" fill="#1e293b" fill-opacity="0.7" stroke-bottom="#334155" />
  <text x="40" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="bold">ALSSPORT Store</text>
  <rect x="760" y="54" width="100" height="24" rx="12" fill="url(#accentGrad)" />
  <text x="810" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">E-Commerce</text>

  <!-- Hero Card -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="110" width="820" height="140" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
  </g>
  <text x="70" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">Premium Athletic Footwear & Apparel</text>
  <text x="70" y="195" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">High-performance sports gear catalog with live category filtering, search, and reviews.</text>
  <rect x="70" y="215" width="130" height="24" rx="6" fill="url(#accentGrad)" />
  <text x="135" y="231" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Explore Features</text>

  <!-- Stat Cards -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="275" width="255" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="322" y="275" width="255" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="605" y="275" width="255" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Stat Card 1 -->
  <rect x="60" y="295" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" />
  <circle cx="78" cy="313" r="8" fill="#0284c7" />
  <text x="60" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">Sport Products</text>
  <text x="60" y="405" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="bold">320+ SKUs</text>

  <!-- Stat Card 2 -->
  <rect x="342" y="295" width="36" height="36" rx="8" fill="#2563eb" fill-opacity="0.2" />
  <circle cx="360" cy="313" r="8" fill="#2563eb" />
  <text x="342" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">Categories</text>
  <text x="342" y="405" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="bold">Footwear / Gear</text>

  <!-- Stat Card 3 -->
  <rect x="625" y="295" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
  <circle cx="643" cy="313" r="8" fill="#10b981" />
  <text x="625" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">Satisfaction</text>
  <text x="625" y="405" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="bold">99.1%</text>
</svg>